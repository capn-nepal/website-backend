app:
  environment: PROD
  # Global Image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  api:
    enabled: true
    containerPort: 80
    command: ["gunicorn", "main.wsgi:application", "--timeout=40", "--bind", "0.0.0.0:80"]
    probes:
      enabled: true
    ingress:
      enabled: true
      className:
      host:
    resources:
      requests:
        cpu: "1"
        memory: 0.5Gi
      limits:
        cpu: "4"
        memory: 1Gi

  # No Celery in this project (no broker/worker/beat).
  worker:
    enabled: false

  hooks:
    enabled: true
    jobs:
      # NOTE: Make sure keys are lowercase.
      # db-migrate and collect-static inherit the chart defaults.
      # wait-for-resources gates the api on DB connectivity.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db"]

  # NOTE: Check main/settings.py for all available options.
  # APP_DOMAIN / FRONTEND_DOMAIN / SESSION_COOKIE_DOMAIN / CSRF_COOKIE_DOMAIN and the
  # S3 endpoint are provided per-environment.
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    APP_TYPE: "WEB"
    TIME_ZONE: "Asia/Kathmandu"
    DEBUG: "false"
    ENABLE_DEBUG_TOOLBAR: "false"
    # Storage: S3 disabled by default (filesystem); enable + set endpoint/credentials per
    # environment. Bucket names are deployment-specific and supplied per-environment.
    AWS_S3_ENABLED: "false"
    # AWS_S3_MEDIA_BUCKET_NAME: ""   # supplied per-environment
    # AWS_S3_STATIC_BUCKET_NAME: ""  # supplied per-environment
    # Sentry
    SENTRY_ENABLED: "false"
    SENTRY_TRACES_SAMPLE_RATE: "0.2"
    SENTRY_PROFILE_SAMPLE_RATE: "0.2"

  # NOTE: Secrets are provided per-environment. Check main/settings.py for all available
  # options (DJANGO_SECRET_KEY, POSTGRES_*, AWS_S3_* credentials, SENTRY_DSN).
  secrets: {}
