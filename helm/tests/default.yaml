app:
  fullnameOverride: capn-website-backend

  image:
    name: ghcr.io/capn-nepal/website-backend
    tag: test-snapshot

  api:
    ingress:
      host: capn-api.example.com

  env:
    APP_DOMAIN: "https://capn-api.example.com"
    FRONTEND_DOMAIN: "https://capn.example.com"
    SESSION_COOKIE_DOMAIN: ".example.com"
    CSRF_COOKIE_DOMAIN: ".example.com"
    AWS_S3_ENABLED: "true"
    AWS_S3_ENDPOINT_URL: "https://capn-s3.example.com/"
    AWS_S3_MEDIA_BUCKET_NAME: "example-media"
    AWS_S3_STATIC_BUCKET_NAME: "example-static"

  secrets:
    DJANGO_SECRET_KEY: "dummy-secret-key"
    # Postgres (external)
    POSTGRES_HOST: capn-postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: capn
    POSTGRES_USER: capn
    POSTGRES_PASSWORD: "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
    # S3 (external)
    AWS_S3_ACCESS_KEY_ID: capn
    AWS_S3_SECRET_ACCESS_KEY: "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
    SENTRY_DSN: "https://dummy@sentry.example.com/1"
