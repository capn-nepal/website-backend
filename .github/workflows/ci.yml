name: CI

on:
  pull_request:

jobs:
  _:
    uses: toggle-corp/banjo-action/.github/workflows/pipeline.yml@v0.5.0
    permissions:
      contents: read
      packages: write
      pull-requests: read
    with:
      # Job: Pre-commit (GDAL system libs for pyright on the GIS deps)
      pre_commit__apt_packages: "gdal-bin libgdal-dev"
      # Job: Docker
      docker__wait_cmd: "./manage.py wait_for_resources --db"
      docker__migration_dummy_test: "main.tests.fake_test"
      docker__run_graphql_check: true
      docker__compose_file: "docker-compose.yaml:.github/gh-docker-compose.yaml"
      docker__compose_service_name: "web"
      docker__compose_test_cmd: "/code/misc/run_tests.sh"
      # Job: Helm
      helm__chart_directory: "./helm"
      helm__version: "v4.3.0"
