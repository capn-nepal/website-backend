  email: String!
  password: String!
}

type Mutation {
  login(data: LoginInput!): UserMeTypeMutationResponseType!
  logout: Boolean!
  changePassword(data: ChangePasswordInput!): ChangePasswordPayload! @isAuthenticated
  createBlog(data: CreateBlogInput!): CreateBlogPayload! @isAuthenticated
  updateBlog(data: UpdateBlogInput!, pk: ID!): UpdateBlogPayload! @isAuthenticated
  createBlogAssets(data: CreateBlogAssetsInput!): CreateBlogAssetsPayload! @isAuthenticated
  addAuthor(data: AddAuthorInput!): AddAuthorPayload! @isAuthenticated
  updateAuthor(data: UpdateAuthorInput!, pk: ID!): UpdateAuthorPayload! @isAuthenticated
}

type OffsetPaginationInfo {
  offset: Int!
  limit: Int
}

input OffsetPaginationInput {
  offset: Int! = 0
  limit: Int
}

input OneToManyInput {
  set: ID
}

type OperationInfo {
  """List of messages returned by the operation."""
  messages: [OperationMessage!]!
}

type OperationMessage {
  """The kind of this message."""
  kind: OperationMessageKind!

  """The error message."""
  message: String!

  """
  The field that caused the error, or `null` if it isn't associated with any particular field.
  """
  field: String

  """The error code, or `null` if no error code was set."""
  code: String
}

enum OperationMessageKind {
  INFO
  WARNING
  ERROR
  PERMISSION
  VALIDATION
}

enum Ordering {
  ASC
  ASC_NULLS_FIRST
  ASC_NULLS_LAST
  DESC
  DESC_NULLS_FIRST
  DESC_NULLS_LAST
}

type Query {
  users(pagination: OffsetPaginationInput, filters: UserFilter, order: UserOrder): UserTypeOffsetPaginated! @isAuthenticated
  me: UserMeType
  blogs(pagination: OffsetPaginationInput, filters: BlogFilter, order: BlogOrder): BlogTypeOffsetPaginated!
  blog(id: ID!): BlogType!
  blogAssets(pagination: OffsetPaginationInput, filters: BlogAssetsFilter, order: BlogAssetsOrder): BlogAssetsTypeOffsetPaginated!
  blogAsset(id: ID!): BlogAssetsType!
  authors(pagination: OffsetPaginationInput): AuthorTypeOffsetPaginated!
  author(id: ID!): AuthorType!
  enums: AppEnumCollection!
}

input StrFilterLookup {
  """Exact match. Filter will be skipped on `null` value"""
